<script>
  // [pathId, color, dotDurationMs, delayMs]
  // Fires in pipeline order: Sources → S3/Kafka → SnowPipe/Spark → Bronze → Silver → Gold → Anaplan → Recon → Consumers
  const SEQUENCE = [
    ['a1', '#374151', 340,  400],
    ['a2', '#374151', 340,  550],
    ['a3', '#7C3AED', 340,  650],
    ['a4', '#374151', 340,  700],
    ['b1', '#374151', 360, 1100],
    ['b2', '#374151', 360, 1250],
    ['b3', '#7C3AED', 360, 1350],
    ['b4', '#374151', 360, 1400],
    ['c1', '#374151', 480, 1800],
    ['c2', '#374151', 480, 1950],
    ['c3', '#D97706', 480, 2100],
    ['c4', '#374151', 480, 2200],
    ['d1', '#9CA3AF', 300, 2900],
    ['e1', '#9CA3AF', 280, 3500],
    ['f1', '#059669', 580, 4200],
    ['f2', '#059669', 580, 4600],
    ['g1', '#9CA3AF', 900, 5000],
    ['g1', '#9CA3AF', 900, 5450],
    ['g1', '#9CA3AF', 900, 5900],
    ['h1', '#374151', 360, 6300],
    ['h2', '#374151', 360, 6450],
    ['h3', '#374151', 360, 6600],
    ['h4', '#374151', 360, 6750],
    ['h5', '#7C3AED', 360, 6900],
  ];

  const LOOP_MS = 10000;

  function animateDot(pathId, color, durationMs, startDelay) {
    setTimeout(() => {
      const path = document.getElementById('path-' + pathId);
      if (!path) return;
      const dotLayer = document.getElementById('dot-layer');
      const totalLength = path.getTotalLength();

      const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      circle.setAttribute('r', '5');
      circle.setAttribute('fill', color);
      circle.setAttribute('stroke', 'white');
      circle.setAttribute('stroke-width', '1.5');
      dotLayer.appendChild(circle);

      const startTime = performance.now();

      function step(now) {
        const t = Math.min((now - startTime) / durationMs, 1);
        const pt = path.getPointAtLength(t * totalLength);
        circle.setAttribute('cx', pt.x);
        circle.setAttribute('cy', pt.y);
        if (t < 1) {
          requestAnimationFrame(step);
        } else {
          circle.remove();
        }
      }
      requestAnimationFrame(step);
    }, startDelay);
  }

  function runAnimation() {
    SEQUENCE.forEach(([pathId, color, dur, delay]) => {
      animateDot(pathId, color, dur, delay);
    });
    setTimeout(runAnimation, LOOP_MS);
  }

  document.fonts.ready.then(() => setTimeout(runAnimation, 400));
</script>
